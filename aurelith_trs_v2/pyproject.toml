[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurelith-trs"
version = "0.2.0"
description = "Temporal Reflective State cognitive architecture research prototype"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.100.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aurelith = "aurelith.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
